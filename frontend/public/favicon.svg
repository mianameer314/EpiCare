<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="epicare-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d5a3f"/>
      <stop offset="100%" stop-color="#143322"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Emerald Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#epicare-grad)" />
  
  <!-- Subtle Top Highlight Border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5" />

  <!-- Crisp White Activity / Pulse Waveform -->
  <path
    d="M12 33h8l6-15 10 28 7-17 4 4h9"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>